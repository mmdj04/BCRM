name: No Response

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  no-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: -1
          days-before-close: 7
          stale-issue-label: "needs-more-info"
          close-issue-message: >
            Closing this issue because it has not had any response since being
            labeled `needs-more-info`. Feel free to reopen if still relevant.
          exempt-issue-labels: "pinned,bug,enhancement,security"
          operations-per-run: 50
