name: Error Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Check for Runtime Errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install -g playwright

      - name: Check site for console errors
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            
            page.on('console', msg => {
              if (msg.type() === 'error') {
                errors.push(msg.text());
              }
            });
            
            page.on('pageerror', err => {
              errors.push(err.message);
            });
            
            try {
              await page.goto('https://bcrm-lilac.vercel.app', { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForTimeout(5000);
              
              // Check key pages
              const pages = ['/dashboard/default', '/auth/login', '/activate'];
              for (const p of pages) {
                try {
                  await page.goto('https://bcrm-lilac.vercel.app' + p, { waitUntil: 'networkidle', timeout: 15000 });
                  await page.waitForTimeout(2000);
                } catch (e) {
                  errors.push('Page load failed: ' + p + ' - ' + e.message);
                }
              }
            } catch (e) {
              errors.push('Navigation error: ' + e.message);
            }
            
            await browser.close();
            
            if (errors.length > 0) {
              console.log('ERRORS_FOUND=' + errors.length);
              console.log('---ERRORS---');
              errors.forEach((e, i) => console.log((i+1) + '. ' + e));
              process.exit(1);
            } else {
              console.log('No errors found. Site is healthy.');
            }
          })();
          "
        continue-on-error: true
        id: check

      - name: Create Issue on failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Runtime errors detected on site',
              body: `## Error Monitor Report\n\n**Time:** ${new Date().toISOString()}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe error monitor detected runtime errors on the deployed site.\n\nPlease check the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n---\n*Automated by error-monitor.yml*`,
              labels: ['bug', 'automated']
            });
