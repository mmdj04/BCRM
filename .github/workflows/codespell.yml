name: Codespell

on:
  pull_request:
  push:
    branches:
      - main
      - v2

permissions:
  contents: read

jobs:
  codespell:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          check_hidden: true
          skip: "*.json,*.lock,package-lock.json,node_modules,.next,dist"
          ignore_words_list: "nda,iff"
